name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.
      # Pin to the 11.x line — npm@latest (12+) requires Node >= 22.
      - run: npm install -g npm@^11

      - name: Set version from git tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # No NODE_AUTH_TOKEN: npm exchanges the OIDC id-token for a short-lived
      # publish token and attaches build provenance automatically.
      - run: npm publish
